mpi:
  - nompi
  - mpich
  - openmpi

# use the m2w64 compiler setup, and match the compiler version pins with the rest of conda-forge, c.f.
# https://github.com/conda-forge/conda-forge-pinning-feedstock/blob/main/recipe/conda_build_config.yaml
c_stdlib:
  - if: win
    then: m2w64-sysroot
c_stdlib_version:
  - if: win
    then: 12
c_compiler:
  - if: win
    then: gcc
c_compiler_version:
  - if: win
    then: 15
fortran_compiler:
  - if: win
    then: gfortran
fortran_compiler_version:
  - if: win
    then: 15
